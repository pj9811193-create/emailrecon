name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Registry sanity (expects >= 116 sites)
        run: |
          python -c "from emailrecon import registry; n = len(registry()); print('sites:', n); assert n >= 116, n"
      - name: Offline parser tests
        run: PYTHONPATH=. python tests/test_parsing.py
      - name: Lint (ruff)
        run: ruff check emailrecon server.py scripts tests
      - name: Browser app JS syntax
        run: python scripts/check_html_js.py

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install puppeteer
        run: npm install puppeteer@23
      - name: Run the app in headless Chromium (demo mode)
        run: node tests/browser_smoke.js

  package:
    name: Build distributable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build emailrecon.zip
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: emailrecon-zip
          path: dist/emailrecon.zip
          if-no-files-found: error
