name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify before releasing
        run: |
          python -c "from emailrecon import registry; n = len(registry()); print('sites:', n); assert n >= 116, n"
          PYTHONPATH=. python tests/test_parsing.py
          python scripts/check_html_js.py

      - name: Build distributable
        run: python scripts/build_release.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/emailrecon.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
